name: integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wordpress-woocommerce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '7.1.1'
            woocommerce: '11.1.1'
            php: '8.3'
          - wordpress: '7.0.5'
            woocommerce: '10.9.4'
            php: '8.3'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: wp-cli

      - name: Install WordPress
        run: |
          mkdir -p /tmp/smg-wp
          cd /tmp/smg-wp
          wp core download --version="${{ matrix.wordpress }}" --force
          wp config create --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          wp core install --url=http://smg.test --title="SMG Integration" --admin_user=admin --admin_password=admin --admin_email=admin@example.test --skip-email

      - name: Install Site Suite and WooCommerce
        run: |
          mkdir -p /tmp/smg-wp/wp-content/plugins/smg-site-suite
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/" /tmp/smg-wp/wp-content/plugins/smg-site-suite/
          cd /tmp/smg-wp
          wp plugin activate smg-site-suite
          wp plugin install "https://downloads.wordpress.org/plugin/woocommerce.${{ matrix.woocommerce }}.zip" --activate

      - name: Enable representative HPOS-safe modules
        run: |
          cd /tmp/smg-wp
          wp option update smg_site_suite_active_modules '["payment-method-column","order-phone-column","woo-order-notes-column","order-item-summary-column","woo-customer-lifetime-orders"]' --format=json

      - name: Runtime smoke on default order storage
        run: |
          cd /tmp/smg-wp
          wp eval-file wp-content/plugins/smg-site-suite/tests/integration/runtime-smoke.php

      - name: Enable HPOS
        run: |
          cd /tmp/smg-wp
          wp wc hpos enable --for-new-shop --ignore-plugin-compatibility
          wp wc hpos status

      - name: Runtime smoke on HPOS
        env:
          SMG_EXPECT_HPOS: '1'
        run: |
          cd /tmp/smg-wp
          wp eval-file wp-content/plugins/smg-site-suite/tests/integration/runtime-smoke.php
