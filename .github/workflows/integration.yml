name: integration

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wordpress-woocommerce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '7.1.1'
            woocommerce: '11.1.1'
            php: '8.3'
          - wordpress: '7.0.5'
            woocommerce: '10.9.4'
            php: '8.3'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: wp-cli

      - name: Install WordPress
        run: |
          mkdir -p /tmp/smg-wp
          cd /tmp/smg-wp
          wp core download --version="${{ matrix.wordpress }}" --force
          wp config create --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          wp core install --url=http://smg.test --title="SMG Integration" --admin_user=admin --admin_password=admin --admin_email=admin@example.test --skip-email

      - name: Install Site Suite and WooCommerce
        run: |
          mkdir -p /tmp/smg-wp/wp-content/plugins/smg-site-suite
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/" /tmp/smg-wp/wp-content/plugins/smg-site-suite/
          cd /tmp/smg-wp
          wp plugin activate smg-site-suite
          wp plugin install "https://downloads.wordpress.org/plugin/woocommerce.${{ matrix.woocommerce }}.zip" --activate

      - name: Verify inactive module isolation
        run: |
          cd /tmp/smg-wp
          wp option update smg_site_suite_active_modules '[]' --format=json
          wp eval-file wp-content/plugins/smg-site-suite/tests/integration/inactive-modules-smoke.php

      - name: Verify module lifecycle contracts
        run: |
          cd /tmp/smg-wp
          wp eval-file wp-content/plugins/smg-site-suite/tests/integration/lifecycle-smoke.php

      - name: Measure zero-module bootstrap overhead
        if: matrix.wordpress == '7.1.1'
        run: |
          cd /tmp/smg-wp
          wp plugin deactivate smg-site-suite --quiet
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/performance-measure.php" > /tmp/smg-baseline.json
          wp plugin activate smg-site-suite --quiet
          wp option update smg_site_suite_active_modules '[]' --format=json --quiet
          wp eval-file "$GITHUB_WORKSPACE/tests/integration/performance-measure.php" > /tmp/smg-suite.json
          php "$GITHUB_WORKSPACE/tests/integration/compare-performance.php" /tmp/smg-baseline.json /tmp/smg-suite.json

      - name: Measure frontend 0/10/50-module profiles
        if: matrix.wordpress == '7.1.1'
        run: |
          cd /tmp/smg-wp
          SMG_PROFILE_SIZE=0 wp eval-file wp-content/plugins/smg-site-suite/tests/integration/performance-profile-setup.php > /tmp/smg-profile-zero-selection.json
          php "$GITHUB_WORKSPACE/tests/integration/frontend-performance-measure.php" /tmp/smg-wp > /tmp/smg-profile-zero.json
          SMG_PROFILE_SIZE=10 wp eval-file wp-content/plugins/smg-site-suite/tests/integration/performance-profile-setup.php > /tmp/smg-profile-ten-selection.json
          php "$GITHUB_WORKSPACE/tests/integration/frontend-performance-measure.php" /tmp/smg-wp > /tmp/smg-profile-ten.json
          SMG_PROFILE_SIZE=50 wp eval-file wp-content/plugins/smg-site-suite/tests/integration/performance-profile-setup.php > /tmp/smg-profile-fifty-selection.json
          php "$GITHUB_WORKSPACE/tests/integration/frontend-performance-measure.php" /tmp/smg-wp > /tmp/smg-profile-fifty.json
          cat /tmp/smg-profile-zero-selection.json
          cat /tmp/smg-profile-ten-selection.json
          cat /tmp/smg-profile-fifty-selection.json
          php "$GITHUB_WORKSPACE/tests/integration/compare-performance-profiles.php" /tmp/smg-profile-zero.json /tmp/smg-profile-ten.json /tmp/smg-profile-fifty.json
          wp option update smg_site_suite_active_modules '[]' --format=json --quiet

      - name: Verify Store API server contracts
        run: |
          cd /tmp/smg-wp
          wp eval-file wp-content/plugins/smg-site-suite/tests/integration/store-api-smoke.php

      - name: Enable representative HPOS-safe modules
        run: |
          cd /tmp/smg-wp
          wp option update smg_site_suite_active_modules '["payment-method-column","order-phone-column","woo-order-notes-column","order-item-summary-column","woo-customer-lifetime-orders"]' --format=json

      - name: Runtime smoke on default order storage
        run: |
          cd /tmp/smg-wp
          wp eval-file wp-content/plugins/smg-site-suite/tests/integration/runtime-smoke.php

      - name: WooCommerce semantic smoke
        run: |
          cd /tmp/smg-wp
          wp eval-file wp-content/plugins/smg-site-suite/tests/integration/woo-semantics-smoke.php

      - name: Enable HPOS
        run: |
          cd /tmp/smg-wp
          wp wc hpos compatibility-mode enable
          wp wc hpos sync
          wp wc hpos count_unmigrated
          wp wc hpos enable --with-sync --ignore-plugin-compatibility
          wp wc hpos status

      - name: Runtime smoke on HPOS
        env:
          SMG_EXPECT_HPOS: '1'
        run: |
          cd /tmp/smg-wp
          wp eval-file wp-content/plugins/smg-site-suite/tests/integration/runtime-smoke.php


  wordpress-minimum:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_minimum
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: wp-cli

      - name: Install minimum supported WordPress
        run: |
          mkdir -p /tmp/smg-wp-min
          cd /tmp/smg-wp-min
          wp core download --version=6.5.11 --force
          wp config create --dbname=wordpress_minimum --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          wp core install --url=http://smg-min.test --title="SMG Minimum" --admin_user=admin --admin_password=admin --admin_email=admin@example.test --skip-email

      - name: Install and activate Site Suite without WooCommerce
        run: |
          mkdir -p /tmp/smg-wp-min/wp-content/plugins/smg-site-suite
          rsync -a --exclude='.git' "$GITHUB_WORKSPACE/" /tmp/smg-wp-min/wp-content/plugins/smg-site-suite/
          cd /tmp/smg-wp-min
          wp plugin activate smg-site-suite
          wp option update smg_site_suite_active_modules '[]' --format=json
          wp eval-file wp-content/plugins/smg-site-suite/tests/integration/inactive-modules-smoke.php
          wp eval-file wp-content/plugins/smg-site-suite/tests/integration/core-minimum-smoke.php
